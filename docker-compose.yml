# Optional: run with a real MongoDB instead of the embedded one.
#   docker compose up -d
# then set MONGODB_URI=mongodb://localhost:27017/taskflow in server/.env
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
